version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kittygram_backend
    env_file:
      - .env
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kittygram_frontend
    volumes:
      - static:/app/build/static
    depends_on:
      - backend
    restart: always

  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kittygram_gateway
    ports:
      - "9000:80"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  pg_data:
  static:
  media: