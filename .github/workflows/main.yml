# .github/workflows/main.yml
# Основной рабочий процесс для развертывания Kittygram

name: Main deployment workflow

on:
  push:
    branches:
      - main

jobs:
  frontend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Configure NodeJS environment
        # Используем готовый action для настройки Node.js
        uses: actions/setup-node@v3
        with:
          # Указываем требуемую версию Node.js
          node-version: 18

      - name: Install frontend dependencies
        # Установка необходимых пакетов для фронтенда
        run: |
          cd frontend/
          npm ci

      - name: Run frontend tests
        # Выполнение тестов клиентской части
        run: |
          cd frontend/
          npm run test

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 flake8-isort==6.0.0
          pip install -r ./backend/requirements.txt
      
      - name: Test with flake8
        run: |
          python -m flake8 backend/
      
      - name: Django tests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECRET_KEY: test-secret-key-for-github-actions  # Добавьте эту строку
        run: |
          cd backend/
          python manage.py test

  build_and_push_backtend_to_docker_hub:
    name: Build and push Backend Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate with DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest

  build_and_push_gateway_to_docker_hub:
    name: Build and push Gateway Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate with DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway:latest

  build_and_push_frontend_to_docker_hub:
    name: Build and push Frontend Docker image
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate with DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backtend_to_docker_hub
      - build_and_push_gateway_to_docker_hub
      - build_and_push_frontend_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "kittygram"
          use_insecure_cipher: true
          timeout: 60s
          command_timeout: 10m
      
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        env:
          ENV_DATA: ${{ secrets.ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}   
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_DATA, DOCKER_USERNAME   
          script: |
            cd kittygram
            echo "$ENV_DATA" > .env
            
            # Выполняет pull образов с Docker Hub
            docker compose -f docker-compose.production.yml pull
            
            # Перезапускает все контейнеры
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d
            
            # Выполняет миграции и сбор статики
            docker compose -f docker-compose.production.yml exec backend python manage.py migrate
            docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic --no-input

  pytests:
    needs:
      - deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements.txt
      - name: Execute pytests
        run: |
          pytest tests/

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Send notification via Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Развертывание Kittygram завершено успешно!
            👤 Автор: ${{ github.actor }}
            📝 Комментарий: ${{ github.event.commits[0].message }}

            📦 Репозиторий: ${{ github.repository }}
            🔗 Коммит: https://github.com/${{ github.repository }}/commit/${{ github.sha }}